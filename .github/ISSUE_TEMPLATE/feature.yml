name: Feature request
description: Propose a focused improvement for a Farsio product.
title: "[Feature]: "
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - NeveshtYar
        - AvaYar
        - farsio.ir
        - Organization / developer experience
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, permissions or security impact
